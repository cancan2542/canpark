services:
  app:
    build:
      context: .
      target: dev
    command: pnpm dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      MICROCMS_SERVICE_DOMAIN: ${MICROCMS_SERVICE_DOMAIN:-}
      MICROCMS_API_KEY: ${MICROCMS_API_KEY:-}
    env_file:
      - path: .env.local
        required: false

volumes:
  node_modules:
  next_cache:
