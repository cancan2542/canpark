services:
  app:
    build:
      context: .
      target: dev
    command: pnpm dev --host 0.0.0.0 --port 4321
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      MICROCMS_SERVICE_DOMAIN: ${MICROCMS_SERVICE_DOMAIN:-}
      MICROCMS_API_KEY: ${MICROCMS_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    env_file:
      - path: .env.local
        required: false

  prod:
    profiles: ["production"]
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true

volumes:
  node_modules:
