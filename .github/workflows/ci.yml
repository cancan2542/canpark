name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      markdown_only: ${{ steps.diff.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Detect Markdown-only diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          markdown_only=false
          case "$EVENT_NAME" in
            pull_request)
              base_sha=$BASE_SHA
              ;;
            push)
              base_sha=$BEFORE_SHA
              ;;
            *)
              base_sha=""
              ;;
          esac

          if [ -n "$base_sha" ] && ./scripts/is-markdown-only.sh "$base_sha" "$HEAD_SHA"; then
            markdown_only=true
          fi

          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Markdown
        run: ./scripts/security-check.sh markdown
      - name: Pre-merge - scan Git history for secrets
        if: needs.changes.outputs.markdown_only != 'true'
        run: ./scripts/security-check.sh repository
      - name: Pre-merge - scan dependencies and configuration
        if: needs.changes.outputs.markdown_only != 'true'
        run: ./scripts/security-check.sh filesystem
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm lint
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm test
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm test:e2e
      - if: needs.changes.outputs.markdown_only != 'true'
        run: pnpm build
      - name: Build production container
        if: needs.changes.outputs.markdown_only != 'true'
        run: docker build --target runner --tag canpark:ci .
      - name: Smoke test production container
        if: needs.changes.outputs.markdown_only != 'true'
        run: |
          docker run --detach --name canpark-ci --publish 127.0.0.1:8080:8080 canpark:ci
          trap 'docker rm --force canpark-ci' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs canpark-ci
          exit 1
      - name: Pre-merge - scan production container
        if: needs.changes.outputs.markdown_only != 'true'
        run: ./scripts/security-check.sh image canpark:ci

  codeql:
    name: CodeQL
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Skip CodeQL for Markdown-only diff
        if: needs.changes.outputs.markdown_only == 'true'
        run: echo "CodeQL skipped because the diff contains only Markdown files."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          category: /language:javascript-typescript
